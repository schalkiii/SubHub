name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Test core + server
        run: cargo test --locked -p subhub-core -p subhub-server

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -p subhub-core -p subhub-server -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
